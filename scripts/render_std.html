<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
    svg { width: 512px; height: 512px; display: block; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

      <stop offset="100%" stop-color="#090d16"/>

    <linearGradient id="pq-cyan" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="100%" stop-color="#06b6d4"/>

    <linearGradient id="pq-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pq-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>

      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>

    <filter id="pq-shadow" x="-20%" y="-20%" width="140%" height="140%">

  <rect width="512" height="512" rx="112" fill="url(#pq-bg)"/>

</html>
