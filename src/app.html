<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>PyQuest — Petualangan Logika Python</title>
		<meta name="description" content="Petualangan belajar logika Python melalui soal interaktif dan coding game labirin 2D." />
		<meta name="application-name" content="PyQuest" />

		<!-- PWA Web App Manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Theme & Status Bar Colors (Dark Navy) -->
		<meta name="theme-color" content="#020617" />
		<meta name="background-color" content="#020617" />

		<!-- iOS Safari PWA Metadata -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="PyQuest" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- PyQuest Branded Favicons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
		<link rel="shortcut icon" href="/favicon.ico" />

		<!-- Google Identity Services (OAuth) -->
		<script src="https://accounts.google.com/gsi/client" async defer></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-950 text-slate-100 select-none antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
